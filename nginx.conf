server {
    listen      8081;
    listen      [::]:8081;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve the static page; fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cheap endpoint for the container HEALTHCHECK and for curl tests.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Don't advertise the exact nginx version to the internet.
    server_tokens off;
}
